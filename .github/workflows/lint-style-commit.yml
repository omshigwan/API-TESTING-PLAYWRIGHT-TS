name: Playwright Prettier Check
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
jobs:
  prettier-check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install dependencies
        run: bun install
      - name: Run Prettier Check
        run: bun run prettier

  BookingApp-Dev-Regression-Trigger:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * 5' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      BASE_URL: ${{ vars.BASE_URL }}
      
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bun x playwright install --with-deps

      - name: Run All Tests
        run: bun run e2eDev:BookingApp

      - name: Debug workspace
        run: ls -R

      - if: always()
        name: Check if playwright-report exists
        run: |
          if [ -d "reports/playwright-report" ]; then
            echo "Report folder exists"
          else
            echo "No report generated"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: reports/playwright-report/
          retention-days: 30
