name: Nightly Regression Test Runs

on:
  schedule:
    # Runs Wed 12:00 AM IST
    - cron: '30 18 * * 2'
    # Runs Fri 12:00 PM IST
    - cron: '30 6 * * 5'


jobs:
  BookingApp-Dev-Regression-Trigger:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 18 * * 2' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install
      
      - name: Install Playwright Browsers
        run: bun x playwright install --with-deps
      
      - name: Run All Tests
        run: bun run e2eDev:BookingApp
      
      - name: Debug workspace
        run: ls -R
      
      - if: always()
        name: Check if playwright-report exists
        run: |
          if [ -d "reports/playwright-report" ]; then
            echo "Report folder exists"
          else
            echo "No report generated"
          fi
      
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: reports/playwright-report/
          retention-days: 30
            
  BookingApp-Dev-Regression-Trigger:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * 5' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest      
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bun x playwright install --with-deps

      - name: Run All Tests
        run: bun run e2eDev:BookingApp

      - name: Debug workspace
        run: ls -R

      - if: always()
        name: Check if playwright-report exists
        run: |
          if [ -d "reports/playwright-report" ]; then
            echo "Report folder exists"
          else
            echo "No report generated"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: reports/playwright-report/
          retention-days: 30
