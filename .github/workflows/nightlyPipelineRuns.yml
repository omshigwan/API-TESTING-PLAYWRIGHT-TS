name: Nightly Regression Test Runs

on:
  schedule:
  # runs pipeline on Tuesdays at 12:30 PM IST/ / 7:00 AM UTC
    - cron: '0 7 * * TUE'
  # runs pipeline on Fridays at 12:30 PM IST / 7:00 AM UTC
    - cron: '0 7 * * FRI'    
  workflow_dispatch:  


jobs:
  BookingApp-Dev-Sanity-Trigger:
    if: ${{ (github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule' && github.event.schedule == '0 7 * * TUE') }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install
      
      - name: Install Playwright Browsers
        run: bun x playwright install --with-deps
      
      - name: Run All Tests
        run: bun run e2eDev:BookingApp
      
      - name: Debug workspace
        run: ls -R
      
      - if: always()
        name: Check if playwright-report exists
        run: |
          if [ -d "reports/playwright-report" ]; then
            echo "Report folder exists"
          else
            echo "No report generated"
          fi
      
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: reports/playwright-report/
          retention-days: 30
            
  BookingApp-Dev-Regression-Trigger:
    if: ${{ (github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule' && github.event.schedule == '0 7 * * FRI') }}
    timeout-minutes: 60
    runs-on: ubuntu-latest      
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bun x playwright install --with-deps

      - name: Run All Tests
        run: bun run e2eDev:BookingApp

      - name: Debug workspace
        run: ls -R

      - if: always()
        name: Check if playwright-report exists
        run: |
          if [ -d "reports/playwright-report" ]; then
            echo "Report folder exists"
          else
            echo "No report generated"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: reports/playwright-report/
          retention-days: 30
